<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriLab · Crashkurs Ernährung & Verdauung</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/space-grotesk/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<style>
:root{
  --bg:#080c17;
  --bg2:#0c1222;
  --card:#121a2e;
  --card2:#18223c;
  --line:#25314f;
  --line2:#33456e;
  --text:#eaeffa;
  --muted:#94a2c2;
  --dim:#6c7a99;
  --amber:#f7b955;
  --mint:#46e39a;
  --coral:#ff7d7d;
  --sky:#5fb2ff;
  --violet:#a98bff;
  --pink:#ff8fd0;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
body{
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(95,178,255,.13), transparent 60%),
    radial-gradient(900px 600px at -5% 110%, rgba(169,139,255,.12), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter Variable',Inter,system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  width:100%;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk Variable','Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.15}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22304f;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#31436c}

/* Alle Diagramm-SVGs skalieren automatisch mit der Breite */
svg[viewBox]{width:100%;height:auto;display:block;max-width:100%}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:296px 1fr;min-height:100vh;max-width:100%}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(13,19,36,.97),rgba(9,13,24,.99));
  border-right:1px solid var(--line);
  padding:22px 16px 40px;
  z-index:80;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:conic-gradient(from 210deg,var(--mint),var(--sky),var(--violet),var(--amber),var(--mint));
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 6px 22px rgba(70,227,154,.28);
}
.brand-mark span{filter:saturate(0) brightness(0)}
.brand-txt strong{display:block;font-family:'Space Grotesk Variable',sans-serif;font-size:17px;letter-spacing:-.02em}
.brand-txt small{color:var(--dim);font-size:11px;letter-spacing:.13em;text-transform:uppercase}

.progbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 8px 18px;display:flex;gap:13px;align-items:center}
.ring{width:56px;height:56px;flex:0 0 56px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#22304f}
.ring .fg{stroke:var(--mint);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-family:'Space Grotesk Variable',sans-serif}
.progbox p{font-size:12px;color:var(--muted);line-height:1.4}
.progbox p strong{color:var(--text);display:block;font-size:13px;margin-bottom:2px}

.navgroup{margin-bottom:16px;padding:0 8px}
.navgroup>span{display:block;font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:0 0 8px 8px;font-weight:600}
.navbtn{
  width:100%;display:flex;align-items:center;gap:10px;
  background:transparent;border:1px solid transparent;color:var(--muted);
  padding:9px 10px;border-radius:11px;cursor:pointer;text-align:left;
  font-size:13.5px;transition:.18s;line-height:1.3;
}
.navbtn:hover{background:rgba(255,255,255,.045);color:var(--text);transform:translateX(2px)}
.navbtn.active{background:linear-gradient(90deg,rgba(95,178,255,.16),rgba(95,178,255,.04));border-color:rgba(95,178,255,.35);color:#fff}
.navbtn .num{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:#1c2742;
  display:grid;place-items:center;font-size:11px;font-weight:700;
  font-family:'Space Grotesk Variable',sans-serif;color:var(--dim);transition:.18s;
}
.navbtn.active .num{background:var(--sky);color:#06101f}
.navbtn.done .num{background:var(--mint);color:#052b1c}
.navbtn.done .num::after{content:'✓'}
.navbtn.done .num i{display:none}
.navbtn .lbl{flex:1;min-width:0}
.main{padding:34px 44px 90px;max-width:1160px;width:100%;min-width:0}

/* ============ COMPONENTS ============ */
.view{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:12px}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--mint);border-radius:2px}
h1{font-size:clamp(28px,4.4vw,46px);margin-bottom:12px;overflow-wrap:break-word}
.lead{color:var(--muted);font-size:17px;max-width:70ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:18px;position:relative;overflow:hidden;min-width:0}
.card.glow::before{content:'';position:absolute;inset:-1px;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,rgba(70,227,154,.5),transparent 40%,transparent 60%,rgba(95,178,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card h2{font-size:22px;margin-bottom:6px}
.card h3{font-size:16px;margin-bottom:8px;color:#fff}
.card p{color:var(--muted);font-size:14.6px;overflow-wrap:break-word}
.card p strong,.card li strong{color:#fff;font-weight:600}
.hl{color:var(--mint);font-weight:600}
.hl-a{color:var(--amber);font-weight:600}
.hl-s{color:var(--sky);font-weight:600}
.hl-c{color:var(--coral);font-weight:600}
.hl-v{color:var(--violet);font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.btn{
  background:linear-gradient(180deg,#243356,#1a2540);border:1px solid var(--line2);color:#fff;
  padding:11px 18px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:600;
  transition:.18s;display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{transform:translateY(-2px);border-color:var(--sky);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(180deg,#4ee0a0,#28b878);border-color:#39d18c;color:#04231a}
.btn-primary:hover{box-shadow:0 10px 26px rgba(70,227,154,.3);border-color:#6cf0b6}
.btn-amber{background:linear-gradient(180deg,#ffcd75,#f0a63a);border-color:#f7b955;color:#2a1a03}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.04em;border:1px solid;white-space:nowrap}
.pill.mint{color:var(--mint);border-color:rgba(70,227,154,.35);background:rgba(70,227,154,.09)}
.pill.amber{color:var(--amber);border-color:rgba(247,185,85,.35);background:rgba(247,185,85,.09)}
.pill.sky{color:var(--sky);border-color:rgba(95,178,255,.35);background:rgba(95,178,255,.09)}
.pill.coral{color:var(--coral);border-color:rgba(255,125,125,.35);background:rgba(255,125,125,.09)}
.pill.violet{color:var(--violet);border-color:rgba(169,139,255,.35);background:rgba(169,139,255,.09)}
.pill.pink{color:var(--pink);border-color:rgba(255,143,208,.35);background:rgba(255,143,208,.09)}

ul.tick{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:10px}
ul.tick li{position:relative;padding-left:26px;font-size:14.4px;color:var(--muted)}
ul.tick li::before{content:'';position:absolute;left:0;top:8px;width:14px;height:14px;border-radius:5px;background:rgba(70,227,154,.16);border:1.5px solid rgba(70,227,154,.5)}
ul.tick li::after{content:'';position:absolute;left:4px;top:12px;width:5px;height:5px;border-radius:2px;background:var(--mint)}
ul.dot{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.dot li{position:relative;padding-left:18px;font-size:14.4px;color:var(--muted)}
ul.dot li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--sky)}

.note{border-left:3px solid var(--amber);background:rgba(247,185,85,.07);padding:13px 16px;border-radius:0 11px 11px 0;font-size:13.8px;color:#e6d9bd;margin-top:14px}
.note b{color:var(--amber)}
.examtip{border-left:3px solid var(--coral);background:rgba(255,125,125,.07);padding:13px 16px;border-radius:0 11px 11px 0;font-size:13.8px;color:#f0d4d4;margin-top:14px}
.examtip b{color:var(--coral)}

/* Tabellen: eigener Scrollbereich, damit die Seite nie überläuft */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border:1px solid var(--line);border-radius:12px}
.twrap::-webkit-scrollbar{height:8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;background:rgba(255,255,255,.02)}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child td{border-bottom:none}
td{color:var(--muted)}
td:first-child{color:#fff;font-weight:600}

/* Labore: Diagramme scrollen bei kleinen Screens horizontal statt winzig zu schrumpfen */
.lab{background:linear-gradient(160deg,rgba(20,29,52,.9),rgba(12,18,34,.9));border:1px solid var(--line2);border-radius:14px;padding:20px;margin:16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
.lab svg{min-width:560px}
@media(max-width:700px){
  .lab{box-shadow:inset -16px 0 18px -16px rgba(95,178,255,.45), inset 16px 0 18px -16px rgba(95,178,255,.45)}
}
.lab-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.lab-head .lab-title{font-family:'Space Grotesk Variable',sans-serif;font-size:14px;font-weight:700;letter-spacing:.01em}
.lab-head .lab-sub{font-size:12px;color:var(--dim);margin-left:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

.hero{position:relative;padding:44px 40px 40px;border-radius:24px;overflow:hidden;margin-bottom:22px;
  background:linear-gradient(135deg,#101a30 0%,#0d1425 50%,#131a33 100%);border:1px solid var(--line2)}
.hero::after{content:'';position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(70,227,154,.22),transparent 65%);pointer-events:none}
.hero::before{content:'';position:absolute;left:-70px;bottom:-120px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(95,178,255,.18),transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:2}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:15px;transition:.2s;cursor:pointer;min-width:0}
.step:hover{background:rgba(255,255,255,.07);transform:translateY(-3px);border-color:var(--line2)}
.step b{display:flex;align-items:center;gap:7px;font-family:'Space Grotesk Variable',sans-serif;font-size:13px;margin-bottom:5px}
.step .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:0 0 26px}
.step p{font-size:12.3px;color:var(--dim);line-height:1.45}

.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
.modtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer;transition:.2s;text-align:left;color:inherit;position:relative;overflow:hidden;min-width:0}
.modtile:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 14px 32px rgba(0,0,0,.42)}
.modtile .mt-n{font-family:'Space Grotesk Variable',sans-serif;font-size:11px;color:var(--dim);letter-spacing:.14em}
.modtile .mt-i{font-size:26px;margin:6px 0 8px;display:block}
.modtile .mt-t{font-weight:700;font-size:15px;display:block;margin-bottom:3px}
.modtile .mt-s{font-size:12.2px;color:var(--muted);line-height:1.4;display:block}
.modtile.isdone{border-color:rgba(70,227,154,.4)}
.modtile.isdone::after{content:'✓ erledigt';position:absolute;top:13px;right:13px;font-size:10px;font-weight:700;color:var(--mint);letter-spacing:.06em}

.modhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}
.modhead .big{
  width:70px;height:70px;flex:0 0 70px;border-radius:20px;display:grid;place-items:center;font-size:34px;
  background:linear-gradient(150deg,rgba(95,178,255,.2),rgba(169,139,255,.12));border:1px solid var(--line2);
}
.modhead h1{font-size:clamp(26px,3.4vw,38px);margin-bottom:8px}
.lzbox{background:rgba(70,227,154,.07);border:1px dashed rgba(70,227,154,.35);border-radius:12px;padding:12px 15px;font-size:13.6px;color:#c7ecd8;margin-top:8px}
.lzbox b{color:var(--mint);display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:3px}
.modnav{display:flex;gap:10px;justify-content:space-between;margin-top:26px;flex-wrap:wrap}

/* Flashcards */
.fc-wrap{perspective:1800px;margin:0 auto;max-width:620px}
.fc{position:relative;width:100%;height:330px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line2);overflow-y:auto}
.fc-front{background:linear-gradient(150deg,#18233e,#111a2e)}
.fc-back{background:linear-gradient(150deg,#123028,#0e1c22);transform:rotateY(180deg)}
.fc-face .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;flex:0 0 auto}
.fc-front .q{font-family:'Space Grotesk Variable',sans-serif;font-size:21px;line-height:1.4;font-weight:600}
.fc-back .a{font-size:16.5px;color:#d9f5e7;line-height:1.6}
.fc-hint{font-size:11.5px;color:var(--dim);margin-top:16px;flex:0 0 auto}
@media(max-width:700px){
  .fc{height:420px}
  .fc-front .q{font-size:18px}
  .fc-back .a{font-size:14.5px}
}

/* Quiz */
.qprog{height:6px;background:#1b2540;border-radius:99px;overflow:hidden;margin-bottom:20px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:99px;transition:width .45s}
.qopts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qopt{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font-size:14.6px;transition:.16s;display:flex;gap:12px;align-items:flex-start;width:100%}
.qopt:hover:not(:disabled){border-color:var(--sky);background:#1d2a49;transform:translateX(3px)}
.qopt .k{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:#233150;display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:'Space Grotesk Variable',sans-serif;color:var(--muted)}
.qopt.correct{border-color:var(--mint);background:rgba(70,227,154,.14)}
.qopt.correct .k{background:var(--mint);color:#04231a}
.qopt.wrong{border-color:var(--coral);background:rgba(255,125,125,.13)}
.qopt.wrong .k{background:var(--coral);color:#2a0808}
.qopt:disabled{cursor:default}
.qfb{margin-top:16px;padding:15px 17px;border-radius:12px;font-size:14px;display:none}
.qfb.show{display:block;animation:fadeUp .35s}
.qfb.ok{background:rgba(70,227,154,.1);border:1px solid rgba(70,227,154,.35);color:#c9f2dd}
.qfb.no{background:rgba(255,125,125,.1);border:1px solid rgba(255,125,125,.35);color:#f6d3d3}

/* Interactive widgets */
.bucket{border:2px dashed var(--line2);border-radius:13px;padding:13px;min-height:132px;transition:.2s;background:rgba(255,255,255,.015);min-width:0}
.bucket.hover{border-color:var(--sky);background:rgba(95,178,255,.08)}
.bucket.ok{border-color:var(--mint);background:rgba(70,227,154,.09)}
.bucket.bad{border-color:var(--coral);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bucket h4{font-size:13px;margin-bottom:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1d2a49;border:1px solid var(--line2);color:#fff;padding:7px 12px;border-radius:99px;font-size:12.6px;font-weight:600;cursor:pointer;transition:.16s;margin:0 6px 8px 0;max-width:100%}
.chip:hover{background:#26375e;transform:translateY(-2px)}
.chip.sel{background:var(--sky);color:#06131f;border-color:var(--sky);box-shadow:0 0 0 3px rgba(95,178,255,.25)}
.chip.placed{background:rgba(70,227,154,.14);border-color:rgba(70,227,154,.4);color:#bff2d9;cursor:default;transform:none}

.journey{display:flex;flex-direction:column;gap:0;margin-top:6px}
.jstep{display:flex;gap:15px;cursor:pointer;padding:2px 0}
.jrail{display:flex;flex-direction:column;align-items:center;flex:0 0 46px}
.jdot{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#18223c;border:1.5px solid var(--line2);transition:.25s;flex:0 0 46px}
.jline{width:2px;flex:1;min-height:20px;background:linear-gradient(180deg,var(--line2),transparent);margin:4px 0}
.jstep:last-child .jline{display:none}
.jbody{flex:1;padding-bottom:16px;min-width:0}
.jbody h4{font-size:15.5px;margin-bottom:3px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.jbody p{font-size:13.4px;color:var(--dim);line-height:1.5}
.jdetail{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0}
.jstep.open .jdetail{max-height:640px;opacity:1;margin-top:10px}
.jstep.open .jdot{background:linear-gradient(150deg,var(--mint),#28b878);border-color:var(--mint);transform:scale(1.06)}
.jstep.open .jbody h4{color:#fff}
.jinner{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.7px;color:var(--muted)}
.jinner ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.jinner li{position:relative;padding-left:16px}
.jinner li::before{content:'▸';position:absolute;left:0;color:var(--mint)}

input[type=range]{width:100%;accent-color:var(--mint);height:6px;cursor:pointer;flex:1;min-width:120px}
.sliderrow{display:flex;align-items:center;gap:15px;margin-top:14px;flex-wrap:wrap}
.readout{font-family:'Space Grotesk Variable',sans-serif;font-size:34px;font-weight:700;color:var(--mint);line-height:1}
.readout small{font-size:14px;color:var(--dim);font-weight:500;margin-left:5px}

.flip3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:900px){.flip3{grid-template-columns:1fr}}
.flipcard{perspective:1200px;height:190px;cursor:pointer}
@media(max-width:900px){.flipcard{height:250px}}
.flipin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}

</style>
</head>
<body>
<button class="menubtn" id="menuBtn" aria-label="Menü öffnen">☰</button>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><span>🧬</span></div>
      <div class="brand-txt">
        <strong>NutriLab</strong>
        <small>Ernährung &amp; Verdauung</small>
      </div>
    </div>

    <div class="progbox">
      <div class="ring">
        <svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="ringFg" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg>
        <b id="ringTxt">0%</b>
      </div>
      <p><strong id="progTxt">0 von 10 Modulen</strong>Du schaffst das – ein Modul nach dem anderen.</p>
    </div>

    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   NUTRILAB — Interaktiver Crashkurs Ernährung & Verdauung (v2.1)
   Fixes: Sidebar-Blur behoben, responsives Scaling, Lab-SVGs
   scrollen statt zu schrumpfen, Nieren-Sim neu aufgebaut.
   ================================================================ */

const MODULES = [
  {n:1,  id:'m1',  icon:'🥗', title:'Nährstoffe',        sub:'Hauptnährstoffe, Energie, Grundumsatz'},
  {n:2,  id:'m2',  icon:'🍞', title:'Kohlenhydrate',     sub:'Zuckerarten & Blutzuckerspiegel'},
  {n:3,  id:'m3',  icon:'🥑', title:'Fette',             sub:'Fettsäuren & Fettgewebe'},
  {n:4,  id:'m4',  icon:'🧬', title:'Proteine',          sub:'Aminosäuren & 3D-Form'},
  {n:5,  id:'m5',  icon:'⚗️', title:'Enzyme',            sub:'Katalysatoren, Amylase, Pepsin'},
  {n:6,  id:'m6',  icon:'🛤️', title:'Verdauungsweg',     sub:'Vom Mund bis zum After'},
  {n:7,  id:'m7',  icon:'🎾', title:'Dünn- & Dickdarm',  sub:'Resorption & Darmzotten'},
  {n:8,  id:'m8',  icon:'🏭', title:'Leber',             sub:'Galle, Speicher, Entgiftung'},
  {n:9,  id:'m9',  icon:'🫘', title:'Nieren',            sub:'Filtration, Resorption, Osmose'},
  {n:10, id:'m10', icon:'⚠️', title:'Verdauungsprobleme',sub:'Laktoseintoleranz & Co.'}
];

const LZ = {
  1:'Du kennst die verschiedenen Nährstoffe und ihre Hauptaufgaben in unserem Körper.',
  2:'Du weisst, wie Kohlenhydrate aufgebaut sind (Stärke, Glykogen …) und wie sich der Blutzuckerspiegel im Vergleich zu Zucker über die Zeit verändert. Du kennst die verschiedenen Zuckerarten.',
  3:'Du kennst wichtige Fettsäuren und wie der Körper diese verarbeitet. Du kannst erklären, welche Aufgaben das Fettgewebe hat.',
  4:'Du kennst den Aufbau von Proteinen und ihre Aufgaben. Du weisst, wie viele Aminosäuren es gibt und was «essentielle» Aminosäuren sind.',
  5:'Du kannst anhand von Beispielen erklären, was Enzyme sind und wie sie wirken. Du kennst zwei Verdauungsenzyme (Amylase, Pepsin).',
  6:'Du kannst den Ablauf der Nahrung durch das Verdauungssystem beschreiben.',
  7:'Du kennst die Aufgabe des Dünn- und Dickdarms und kannst erklären, weshalb der Dünndarm Falten und Zotten hat.',
  8:'Du kannst drei Aufgaben der Leber beschreiben.',
  9:'Du kannst erklären, wie die Nieren funktionieren und welche Aufgaben sie übernehmen.',
  10:'Du kannst Ursachen für vorgegebene Verdauungsprobleme nennen und begründen.'
};

/* ---------------- STATE ---------------- */
const state = {
  done: new Set(),
  view: 'start',
  cardIdx: 0,
  cardFlipped: false,
  cardOrder: [],
  quizIdx: 0,
  quizOrder: [],
  quizScore: 0,
  quizAnswered: false,
  quizWrong: [],
  quizStart: 0,
  knownCards: new Set()
};

function save(){
  try{
    localStorage.setItem('nutrilab_v2', JSON.stringify({done:[...state.done], known:[...state.knownCards]}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('nutrilab_v2');
    if(raw){
      const d = JSON.parse(raw);
      (d.done||[]).forEach(x=>state.done.add(x));
      (d.known||[]).forEach(x=>state.knownCards.add(x));
    }
  }catch(e){}
}

/* ---------------- HELPERS ---------------- */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> [...(r||document).querySelectorAll(s)];
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function toggleDone(n){
  if(state.done.has(n)) state.done.delete(n); else { state.done.add(n); toast('✓ Lernziel '+n+' abgehakt – weiter so!'); }
  save(); updateProgress();
}
function updateProgress(){
  const p = Math.round(state.done.size/MODULES.length*100);
  const c = 2*Math.PI*23;
  const fg = $('#ringFg'); if(fg) fg.style.strokeDashoffset = c - c*p/100;
  const rt = $('#ringTxt'); if(rt) rt.textContent = p+'%';
  const pt = $('#progTxt'); if(pt) pt.textContent = state.done.size+' von 10 Modulen';
  $$('.navbtn').forEach(b=>{
    const n = b.dataset.mod;
    if(n) b.classList.toggle('done', state.done.has(+n));
  });
  $$('.modtile').forEach(b=>{
    const n = b.dataset.mod;
    if(n) b.classList.toggle('isdone', state.done.has(+n));
  });
}
function go(v){
  document.onkeydown = null;
  state.view = v;
  const V = VIEWS[v];
  $('#view').innerHTML = V.render();
  if(V.init) V.init();
  $$('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  window.scrollTo({top:0,behavior:'smooth'});
  $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show');
}

/* ---------------- NAV ---------------- */
function buildNav(){
  let h = '<div class="navgroup"><span>Übersicht</span>';
  h += navItem('start','🏠','Start & Lernplan');
  h += navItem('crash','⚡','Crash-Zettel');
  h += '</div>';
  h += '<div class="navgroup"><span>Die 10 Lernziele</span>';
  MODULES.forEach(m=>{
    h += '<button class="navbtn'+(state.done.has(m.n)?' done':'')+'" data-view="'+m.id+'" data-mod="'+m.n+'">'+
      '<span class="num"><i>'+m.n+'</i></span><span class="lbl">'+m.icon+' '+m.title+'</span></button>';
  });
  h += '</div>';
  h += '<div class="navgroup"><span>Trainieren</span>';
  h += navItem('cards','🃏','Karteikarten');
  h += navItem('quiz','🎯','Prüfungssimulator');
  h += navItem('glossar','📖','Fachbegriffe');
  h += '</div>';
  $('#nav').innerHTML = h;
  $$('.navbtn').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.view)));
  function navItem(v,ic,lb){
    return '<button class="navbtn" data-view="'+v+'"><span class="num">'+ic+'</span><span class="lbl">'+lb+'</span></button>';
  }
}

/* ---------------- SHARED MODULE SHELL ---------------- */
function shell(m, body){
  const prev = m.n>1 ? MODULES[m.n-2] : null;
  const next = m.n<10 ? MODULES[m.n] : null;
  return '<div class="view">'+
    '<div class="modhead">'+
      '<div class="big">'+m.icon+'</div>'+
      '<div style="flex:1;min-width:240px">'+
        '<div class="eyebrow">Lernziel '+m.n+' von 10</div>'+
        '<h1>'+m.title+'</h1>'+
        '<p class="lead">'+m.sub+'</p>'+
        '<div class="lzbox"><b>🎯 Das musst du können</b>'+LZ[m.n]+'</div>'+
      '</div>'+
    '</div>'+
    body+
    '<div class="card" style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap">'+
      '<div><h3 style="margin-bottom:2px">Verstanden?</h3><p style="font-size:13px">Hake das Lernziel ab, sobald du es sicher erklären kannst.</p></div>'+
      '<button class="btn '+(state.done.has(m.n)?'btn-ghost':'btn-primary')+'" id="markBtn">'+(state.done.has(m.n)?'✓ Erledigt – zurücknehmen':'Als gelernt markieren')+'</button>'+
    '</div>'+
    '<div class="modnav">'+
      (prev?'<button class="btn btn-ghost" id="prevBtn">← '+prev.icon+' '+prev.title+'</button>':'<button class="btn btn-ghost" id="prevBtn">← Übersicht</button>')+
      (next?'<button class="btn btn-primary" id="nextBtn">'+next.icon+' '+next.title+' →</button>':'<button class="btn btn-amber" id="nextBtn">🎯 Zum Prüfungssimulator →</button>')+
    '</div>'+
  '</div>';
}
function shellInit(m){
  const mb = $('#markBtn');
  if(mb) mb.addEventListener('click', ()=>{ toggleDone(m.n); go(m.id); });
  const pb = $('#prevBtn');
  if(pb) pb.addEventListener('click', ()=> go(m.n>1?MODULES[m.n-2].id:'start'));
  const nb = $('#nextBtn');
  if(nb) nb.addEventListener('click', ()=> go(m.n<10?MODULES[m.n].id:'quiz'));
}

/* ================================================================
   VIEW: START
   ================================================================ */
function renderStart(){
  const p = Math.round(state.done.size/10*100);
  let h = '<div class="view">';
  h += '<div class="hero">'+
      '<div class="eyebrow">Interaktiver Crashkurs · NT Ernährung</div>'+
      '<h1>Verdauung &amp; Nährstoffe<br>in 10 klaren Schritten</h1>'+
      '<p class="lead">Jedes Lernziel deines Dossiers als eigenes Modul: kurze Erklärung, interaktives Experiment zum Anfassen und Prüfungs-Tipp. Am Ende testest du dich im Prüfungssimulator.</p>'+
      '<div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">'+
        '<button class="btn btn-primary" data-go="m1">🚀 Jetzt starten bei Lernziel 1</button>'+
        '<button class="btn btn-amber" data-go="crash">⚡ Nur der Crash-Zettel</button>'+
        '<button class="btn" data-go="quiz">🎯 Direkt ins Quiz</button>'+
      '</div>'+
      '<div class="steps">'+
        stepBox('1','📗','Module lesen','10 Lernziele – je 3–5 Minuten', '#46e39a')+
        stepBox('2','🔬','Labore testen','Klicken, schieben, beobachten', '#5fb2ff')+
        stepBox('3','🃏','Karten wiederholen','49 Karteikarten mit Selbsttest', '#a98bff')+
        stepBox('4','🎯','Quiz bestehen','42 Fragen wie im echten Test', '#f7b955')+
      '</div>'+
    '</div>';

  h += '<div class="card"><h2>Dein Fortschritt</h2><p>Der Balken füllt sich, sobald du ein Lernziel als gelernt markierst.</p>'+
       '<div style="height:10px;background:#1b2540;border-radius:99px;overflow:hidden;margin-top:14px">'+
       '<i style="display:block;height:100%;width:'+p+'%;background:linear-gradient(90deg,#46e39a,#5fb2ff);border-radius:99px;transition:width .6s"></i></div>'+
       '<p style="margin-top:9px;font-size:13px"><span class="hl">'+state.done.size+'/10</span> Lernziele erledigt · <span class="hl-a">'+state.knownCards.size+'/49</span> Karteikarten gemeistert</p></div>';

  h += '<div class="card"><h2>Alle Module</h2><p style="margin-bottom:16px">Klicke ein Lernziel an – die Reihenfolge folgt deinem Dossier.</p><div class="modgrid">';
  MODULES.forEach(m=>{
    h += '<button class="modtile'+(state.done.has(m.n)?' isdone':'')+'" data-go="'+m.id+'" data-mod="'+m.n+'">'+
      '<span class="mt-n">LERNZIEL '+m.n+'</span><span class="mt-i">'+m.icon+'</span>'+
      '<span class="mt-t">'+m.title+'</span><span class="mt-s">'+m.sub+'</span></button>';
  });
  h += '</div></div>';

  h += '<div class="card glow"><h2>🧭 Die grosse Zusammenhänge-Karte</h2>'+
    '<p>Alles im Dossier hängt an einer Kette. Verstehe diese Linie – und du verstehst das ganze Thema:</p>'+
    '<div class="lab" style="text-align:center;font-family:\'Space Grotesk Variable\',sans-serif;font-size:13.5px;line-height:2.4;color:#cfe0f7">'+
    'NAHRUNG <span style="color:#46e39a">→</span> MUND <span style="color:#46e39a">(Amylase)</span> <span style="color:#46e39a">→</span> SPEISERÖHRE <span style="color:#46e39a">→</span> MAGEN <span style="color:#46e39a">(Pepsin + HCl)</span> <span style="color:#46e39a">→</span> ZWÖLFFINGERDARM <span style="color:#46e39a">(Galle aus der LEBER)</span> <span style="color:#46e39a">→</span> DÜNNDARM <span style="color:#46e39a">(Resorption → Blut)</span> <span style="color:#46e39a">→</span> DICKDARM <span style="color:#46e39a">(Wasserentzug)</span> <span style="color:#46e39a">→</span> AFTER'+
    '<div style="margin-top:10px;font-size:12.5px;color:#94a2c2">Parallel: Blut <span style="color:#5fb2ff">→</span> LEBER (Umbau/Speicher/Entgiftung) &nbsp;·&nbsp; Blut <span style="color:#5fb2ff">→</span> NIEREN (Filtration → Primärharn → Resorption → Urin)</div>'+
    '</div></div>';

  h += '</div>';
  return h;
  function stepBox(n,ic,t,d,col){
    return '<div class="step"><b><span class="ic" style="background:'+col+'22;color:'+col+'">'+ic+'</span> Schritt '+n+' · '+t+'</b><p>'+d+'</p></div>';
  }
}

/* ================================================================
   MODULE 1 — NÄHRSTOFFE
   ================================================================ */
function m1(){
  const body = `
  <div class="card glow">
    <span class="pill mint">GRUNDLAGEN</span>
    <h2 style="margin-top:12px">Was ist Stoffwechsel?</h2>
    <p>Wir atmen, essen und trinken und nehmen dabei <strong>Sauerstoff, Nährstoffe und Wasser</strong> auf. Diese Stoffe werden transportiert und in chemischen Reaktionen umgewandelt. Es entstehen auch Stoffe, die der Körper nicht verwerten kann – die <strong>Abfallstoffe</strong>. Sie werden an die Umgebung abgegeben.</p>
    <div class="note"><b>Merksatz:</b> Aufnahme + Transport + Umwandlung + Abgabe von Stoffen = <b>Stoffwechsel</b>.</div>
  </div>

  <div class="card">
    <h2>Die Hauptnährstoffe</h2>
    <p>Drei Nährstoffgruppen machen den grössten Anteil unserer Nahrung aus – deshalb heissen sie <strong>Hauptnährstoffe</strong>. Dazu kommen Vitamine, Mineralstoffe und Ballaststoffe.</p>
    <div class="grid3" style="margin-top:16px">
      <div class="stat" style="text-align:left;padding:18px;border-top:3px solid #f7b955">
        <div style="font-size:26px">🍚</div>
        <b style="font-size:15px;display:block;margin:7px 0 4px">Kohlenhydrate</b>
        <span style="font-size:12.8px;color:#94a2c2">Wichtigste <b style="color:#f7b955">Energielieferanten</b> für Muskeln, Temperatur und Reaktionen.</span>
      </div>
      <div class="stat" style="text-align:left;padding:18px;border-top:3px solid #ff8fd0">
        <div style="font-size:26px">🥑</div>
        <b style="font-size:15px;display:block;margin:7px 0 4px">Fette</b>
        <span style="font-size:12.8px;color:#94a2c2">Energiereichster Nährstoff, <b style="color:#ff8fd0">Speicher</b>, Baustoff, Vitamin-Taxi.</span>
      </div>
      <div class="stat" style="text-align:left;padding:18px;border-top:3px solid #5fb2ff">
        <div style="font-size:26px">🥚</div>
        <b style="font-size:15px;display:block;margin:7px 0 4px">Proteine</b>
        <span style="font-size:12.8px;color:#94a2c2">Lebenswichtige <b style="color:#5fb2ff">Baustoffe</b>, Enzyme, Hormone, Antikörper.</span>
      </div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="lab" style="margin:0">
        <div class="lab-head"><span class="pill sky">FUNKTION 1</span><span class="lab-title">Baustoffe</span></div>
        <p style="font-size:13.6px">Ein Teil der Nährstoffe wird in chemischen Reaktionen umgewandelt und für die <strong style="color:#fff">Bildung neuer Zellen</strong> genutzt – Wachstum, Reparatur, Muskeln, Haut.</p>
      </div>
      <div class="lab" style="margin:0">
        <div class="lab-head"><span class="pill amber">FUNKTION 2</span><span class="lab-title">Energielieferanten</span></div>
        <p style="font-size:13.6px">Bei der Umwandlung wird Energie frei. Sie wird genutzt für: <strong style="color:#fff">Muskelbewegung · Körpertemperatur · Stofftransport · chemische Reaktionen</strong>.</p>
      </div>
    </div>
    <div class="examtip"><b>Prüfungs-Tipp:</b> «Nenne vier Vorgänge, die zum Stoffwechsel gehören» → Atmen (Sauerstoffaufnahme), Essen/Trinken (Nährstoffaufnahme), Transport im Körper, Umwandlung in Zellen, Abgabe von Abfallstoffen.</div>
  </div>

  <div class="card">
    <h2>🔬 Labor 1 · Energiegehalt vergleichen</h2>
    <p>Wie viel Energie steckt in 1 g eines Nährstoffs? Klicke die Balken an.</p>
    <div class="lab">
      <div id="ebar"></div>
      <div style="display:flex;gap:9px;margin-top:15px;flex-wrap:wrap">
        <button class="btn btn-sm" data-e="kh">Kohlenhydrate</button>
        <button class="btn btn-sm" data-e="pr">Proteine</button>
        <button class="btn btn-sm" data-e="fe">Fette</button>
        <button class="btn btn-sm btn-ghost" data-e="all">Alle anzeigen</button>
      </div>

function m2init(){
  shellInit(MODULES[1]);
  /* --- Sortiermaschine --- */
  const ITEMS = [
    {t:'Traubenzucker (Glukose)',g:'einfach'},{t:'Fruchtzucker (Fruktose)',g:'einfach'},
    {t:'Kristallzucker (Saccharose)',g:'zwei'},{t:'Malzzucker',g:'zwei'},
    {t:'Stärke',g:'viel'},{t:'Glykogen',g:'viel'},{t:'Cellulose',g:'viel'}
  ];
  let sel = null, placed = 0;
  function renderPool(){
    const order = [...ITEMS].sort(()=>Math.random()-.5);
    $('#pool').innerHTML = order.map(it=>'<button class="chip" data-i="'+ITEMS.indexOf(it)+'">'+it.t+'</button>').join('');
    $$('#pool .chip').forEach(c=> c.addEventListener('click',()=>{
      if(c.classList.contains('placed')) return;
      $$('#pool .chip').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel'); sel = c;
    }));
    $$('.bucket').forEach(b=>{
      b.addEventListener('click',()=>{
        if(!sel) return;
        const it = ITEMS[+sel.dataset.i];
        if(it.g===b.dataset.g){
          b.classList.add('ok'); setTimeout(()=>b.classList.remove('ok'),600);
          sel.classList.remove('sel'); sel.classList.add('placed'); sel.disabled=true;
          b.querySelector('.drop').innerHTML += '<span class="chip placed" style="margin:0 4px 6px 0">'+it.t+' ✓</span>';
          sel=null; placed++;
          $('#sortmsg').innerHTML = placed+'/'+ITEMS.length+' korrekt sortiert'+(placed===ITEMS.length?' – <span class="hl">perfekt!</span>':' …');
          if(placed===ITEMS.length) toast('🎉 Alle Zuckerarten richtig sortiert!');
        } else {
          b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450);
          sel.classList.remove('sel'); sel=null;
          $('#sortmsg').innerHTML = '<span class="hl-c">Falsch – Versuch es erneut.</span>';
        }
      });
    });
    sel=null; placed=0;
    $('#sortmsg').textContent = 'Klicke einen Begriff an, dann die passende Schublade.';
  }
  renderPool();
  $('#sortReset').addEventListener('click',()=>{ $$('.bucket .drop').forEach(d=>d.innerHTML=''); renderPool(); });

  /* --- Blutzucker-Animation --- */
  const A = $('#curveA'), B = $('#curveB'), dA = $('#dotA'), dB = $('#dotB');
  let raf=null;
  function prep(p){
    const L = p.getTotalLength();
    p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    p.getBoundingClientRect();
    p.style.transition='stroke-dashoffset 3.6s ease-in-out'; p.style.strokeDashoffset='0';
  }
  function resetCurves(){
    if(raf) cancelAnimationFrame(raf);
    [A,B].forEach(p=>{ p.style.transition='none'; p.style.strokeDasharray='none'; p.style.strokeDashoffset='0'; });
    dA.setAttribute('cx',56); dA.setAttribute('cy',150);
    dB.setAttribute('cx',56); dB.setAttribute('cy',150);
    $('#bzVal').innerHTML='–<small>relativer Blutzucker</small>';
    $('#bzTxt').textContent='Drücke «abspielen» und beobachte den roten Punkt.';
  }
  resetCurves();
  $('#bzPlay').addEventListener('click',()=>{
    resetCurves();
    const LA = A.getTotalLength(), LB = B.getTotalLength();
    prep(A); prep(B);
    const t0 = performance.now(), dur = 3600;
    const msgs = [
      [0.06,'Nach dem Essen: Der Einfachzucker flutet das Blut …'],
      [0.16,'⚡ Peak! Der Spiegel schiesst weit über den Normalwert.'],
      [0.34,'Der Körper schüttet Insulin aus – der Zucker wird schnell abgebaut.'],
      [0.55,'📉 Absturz: Der Spiegel fällt UNTER die Normallinie.'],
      [0.72,'Folge: Heisshunger, Müdigkeit, Konzentrationsproblem.'],
      [0.9,'Die Stärke-Kurve verläuft flach – Energie über Stunden.']
    ];
    let mi=0;
    function frame(now){
      const t = Math.min((now-t0)/dur,1);
      const pa = A.getPointAtLength(LA*t), pb = B.getPointAtLength(LB*t);
      dA.setAttribute('cx',pa.x); dA.setAttribute('cy',pa.y);
      dB.setAttribute('cx',pb.x); dB.setAttribute('cy',pb.y);
      const val = Math.round((150-pa.y)/150*100);
      $('#bzVal').innerHTML = val+'<small>% (Einfachzucker)</small>';
      while(mi<msgs.length && t>=msgs[mi][0]){ $('#bzTxt').textContent = msgs[mi][1]; mi++; }
      if(t<1) raf=requestAnimationFrame(frame);
      else $('#bzTxt').textContent='Fertig: Rot = schneller Peak + Absturz. Blau = flache, lang anhaltende Kurve.';
    }
    raf=requestAnimationFrame(frame);
  });
  $('#bzReset').addEventListener('click', resetCurves);
}

    {e:'🚕',t:'Vitamin-Transport',d:'Fette dienen als «Taxi» für die fettlöslichen Vitamine A, D, E und K und sorgen dafür, dass diese aufgenommen werden können.'}
  ];
  $('#fatTasks').innerHTML = TASKS.map((x,i)=>
    '<div class="lab" style="margin:0;cursor:pointer" data-f="'+i+'">'+
    '<div class="lab-head" style="margin-bottom:6px"><span style="font-size:22px">'+x.e+'</span><span class="lab-title">'+x.t+'</span><span class="lab-sub" style="color:#46e39a">+ antippen</span></div>'+
    '<p class="fd" style="font-size:13.4px;display:none">'+x.d+'</p></div>').join('');
  $$('[data-f]').forEach(el=> el.addEventListener('click',()=>{
    const p = el.querySelector('.fd'); const on = p.style.display==='block';
    $$('[data-f] .fd').forEach(x=>x.style.display='none');
    $$('[data-f]').forEach(x=>x.style.borderColor='');

  }));

  const vits = $$('#vitamins .vit');
  let raf=null;
  function resetVits(){
    vits.forEach(v=>{
      const c=v.querySelector('circle'),t=v.querySelector('text');
      c.style.transition='none';t.style.transition='none';
      c.style.transform='none';t.style.transform='none';
      v.style.opacity='1';
    });
  }
  function withFat(){
    if(raf) cancelAnimationFrame(raf);
    resetVits();
    const path = $('#taxiPath'); const L = path.getTotalLength();
    path.setAttribute('stroke','#46e39a'); path.setAttribute('stroke-dasharray','none');
    $('#taxiFat').style.opacity='1';
    const t0=performance.now();
    function f(now){
      const t=Math.min((now-t0)/2400,1);
      vits.forEach((v,i)=>{
        const tt = Math.max(0, Math.min(1, t*1.15 - i*0.03));
        const p2 = path.getPointAtLength(L*tt);
        const c = v.querySelector('circle'), tx = v.querySelector('text');
        c.setAttribute('cx',p2.x); c.setAttribute('cy',p2.y);
        tx.setAttribute('x',p2.x); tx.setAttribute('y',p2.y+5);
        v.style.opacity = t>0.93 ? String(1-(t-0.93)/0.07) : '1';
      });
      if(t<1) raf=requestAnimationFrame(f);
      else setTimeout(()=>{ if(state.view==='m3') withFat(); }, 900);
    }
    raf=requestAnimationFrame(f);
    $('#taxiTxt').innerHTML='<span class="hl">Mit Fett:</span> Die Vitamine A, D, E und K steigen ins «Taxi» und gelangen durch die Darmwand ins Blut. Der Körper ist versorgt.';
  }
  function noFat(){
    if(raf) cancelAnimationFrame(raf);
    resetVits();
    const path = $('#taxiPath'); path.setAttribute('stroke','#ff7d7d'); path.setAttribute('stroke-dasharray','4 8');
    $('#taxiFat').style.opacity='.15';
    vits.forEach((v,i)=>{
      const c=v.querySelector('circle'), tx=v.querySelector('text');
      c.style.transition='transform .8s cubic-bezier(.4,0,.2,1) '+(i*0.08)+'s';
      tx.style.transition='transform .8s cubic-bezier(.4,0,.2,1) '+(i*0.08)+'s';
      requestAnimationFrame(()=>{ c.style.transform='translateY(56px)'; tx.style.transform='translateY(56px)'; });
      v.style.opacity='.55';
    });
    $('#taxiTxt').innerHTML='<span class="hl-c">Ohne Fett:</span> Die fettlöslichen Vitamine können nicht aufgenommen werden – sie werden ungenutzt ausgeschieden. Langfristig drohen Mangelerscheinungen.';
  }
  $('#fatOn').addEventListener('click', withFat);
  $('#fatOff').addEventListener('click', noFat);
  withFat();
}

function m4init(){
  shellInit(MODULES[3]);
  const COLS = ['#5fb2ff','#46e39a','#f7b955','#ff8fd0','#a98bff','#ff7d7d'];
  const ROLES = [
    {n:'Antikörper',d:'Abwehrstoff – erkennt und bekämpft Krankheitserreger.',e:'🛡️'},
    {n:'Keratin',d:'Haarprotein – bildet Haare, Nägel und die oberste Hautschicht.',e:'💇'},
    {n:'Hämoglobin',d:'Transportprotein – befördert Sauerstoff im Blut.',e:'🩸'},
    {n:'Enzym',d:'Biologischer Katalysator – beschleunigt Stoffumwandlungen.',e:'⚗️'},
    {n:'Hormon',d:'Botenstoff – überträgt Signale im Körper.',e:'📨'},
    {n:'Muskelprotein',d:'Baustoff – sorgt für die Bewegung der Muskeln.',e:'💪'}
  ];
  let chain=[], folded=false, role=null;
  function draw(){
    const g = $('#pChain');
    if(!chain.length){ g.innerHTML=''; return; }
    let inner='';
    if(!folded){
      const step = Math.min(34, 600/(chain.length+1));
      const x0 = 20;
      chain.forEach((c,i)=>{
        const x=x0+step*(i+0.6);
        if(i>0) inner+='<line x1="'+(x-step)+'" y1="95" x2="'+x+'" y2="95" stroke="#33456e" stroke-width="3"/>';
        inner+='<circle cx="'+x+'" cy="95" r="12" fill="'+c+'33" stroke="'+c+'" stroke-width="2.5"/>';
        inner+='<circle cx="'+x+'" cy="95" r="3.5" fill="'+c+'"/>';
      });
      inner+='<text x="320" y="150" class="lbl" text-anchor="middle" font-size="11.5">gerade Aminosäure-Kette ('+chain.length+' Perlen = '+chain.length+' Aminosäuren)</text>';
      inner+='<text x="320" y="172" class="lbl" text-anchor="middle" font-size="11" fill="#6c7a99">So liegt sie noch nicht in der Zelle vor – erst falten!</text>';
    } else {
      let pts=[];
      const cx=320, cy=90;
      chain.forEach((c,i)=>{
        const a = i*0.85;
        const r = 12 + i*3.1;
        pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.72]);
      });
      pts.forEach((p,i)=>{
        if(i>0) inner+='<line x1="'+pts[i-1][0]+'" y1="'+pts[i-1][1]+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#33456e" stroke-width="2.5"/>';
      });
      pts.forEach((p,i)=>{
        inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10" fill="'+chain[i]+'33" stroke="'+chain[i]+'" stroke-width="2.5"/>';
        inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+chain[i]+'"/>';
      });
      inner+='<text x="320" y="180" class="lbl-b" text-anchor="middle" font-size="12" fill="#46e39a">✓ Gefaltete, dreidimensionale Form – das Protein kann seine Aufgabe übernehmen</text>';
    }
    g.innerHTML = inner;
  }
  $('#pBuild').addEventListener('click',()=>{
    folded=false;
    const len = 6+Math.floor(Math.random()*7);
    chain = Array.from({length:len},()=>COLS[Math.floor(Math.random()*COLS.length)]);
    role = ROLES[Math.floor(Math.random()*ROLES.length)];
    draw();
    $('#pOut').innerHTML='Neue Kette aus <b style="color:#5fb2ff">'+len+' Aminosäuren</b> gebaut. Noch ist sie gerade – <b>falte sie</b>, damit sie funktionsfähig wird.';
  });
  $('#pFold').addEventListener('click',()=>{
    if(!chain.length){ toast('Baue zuerst ein Protein!'); return; }
    folded=true; draw();
    $('#pOut').innerHTML='<span class="hl">'+role.e+' Ergebnis: '+role.n+'</span><br>'+role.d+
      '<br><span style="color:#6c7a99;font-size:12.6px">Die Faltung (= 3D-Form) entscheidet, welche Aufgabe das Protein übernimmt.</span>';
  });
  $('#pBuild').click();
}

function m5init(){
  shellInit(MODULES[4]);
  /* --- Energiemodell --- */
  let raf=null;
  function roll(withEnz){
    if(raf) cancelAnimationFrame(raf);
    const path = withEnz ? $('#hillEnz') : $('#hillNo');
    const ball = $('#ball');
    const L = path.getTotalLength();
    const dur = withEnz ? 1800 : 3600;
    const t0 = performance.now();
    $('#ballTxt').innerHTML = withEnz
      ? '<span class="hl">Mit Enzym:</span> Die Aktivierungsenergie ist gesenkt – die Kugel rollt schnell und mühelos über den kleinen Berg. Die Körpertemperatur reicht aus.'
      : '<span class="hl-c">Ohne Enzym:</span> Die Kugel muss den hohen Berg hinauf – das dauert lange und braucht viel Energie, die der Körper bei 37 °C nicht aufbringen kann.';
    function f(now){
      const t = Math.min((now-t0)/dur,1);
      const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      const p = path.getPointAtLength(L*e);
      ball.setAttribute('cx',p.x); ball.setAttribute('cy',p.y-11);
      ball.setAttribute('fill', withEnz?'#46e39a':'#ff7d7d');
      if(t<1) raf=requestAnimationFrame(f);
    }
    raf=requestAnimationFrame(f);
  }
  $('#ballNo').addEventListener('click',()=>roll(false));
  $('#ballEnz').addEventListener('click',()=>roll(true));

  /* --- Schlüssel-Schloss --- */
  const ENZ = {
    amylase:{
      name:'Amylase', place:'Speichel / Mund',
      sub:{label:'Stärke (Vielfachzucker)', blocks:5, col:'#f7b955'},
      prod:{label:'Malzzucker (Zweifachzucker)', parts:[2,3], col:'#46e39a'},
      txt:'<span class="hl">Amylase passt exakt zur Stärke.</span> Die lange Kette aus Einfachzuckern wird zerlegt – es entstehen Zweifachzucker (Malzzucker). Das Enzym bleibt dabei unverändert und kann sofort weiterarbeiten.'
    },
    pepsin:{
      name:'Pepsin', place:'Magen (mit Salzsäure)',
      sub:{label:'Protein (Aminosäure-Kette)', blocks:6, col:'#5fb2ff'},
      prod:{label:'Aminosäuren', parts:[1,1,1,1,1,1], col:'#a98bff'},
      txt:'<span class="hl">Pepsin passt zu Proteinen.</span> Zusammen mit der Salzsäure zerlegt es die Aminosäure-Ketten in einzelne Aminosäuren – die Grundbausteine.'
    }
  };
  let cur = 'amylase', lkBusy=false;
  function drawLock(){
    lkBusy=false;
    const e = ENZ[cur];
    const n = e.sub.blocks;
    const w = 42, gap=4;
    const totalW = n*(w+gap)-gap;
    const x0 = 90;
    let sub='';
    for(let i=0;i<n;i++){
      const x = x0+i*(w+gap);
      sub+='<rect x="'+x+'" y="66" width="'+w+'" height="40" rx="9" fill="'+e.sub.col+'22" stroke="'+e.sub.col+'" stroke-width="2"/>';
    }
    sub+='<text x="'+(x0+totalW/2)+'" y="52" class="lbl-b" text-anchor="middle" font-size="12">'+e.sub.label+'</text>';
    $('#lkSub').innerHTML = sub;
    $('#lkSub').style.opacity='1';
    $('#lkEnz').innerHTML =
      '<g id="lkEnzG">'+
      '<path d="M360,14 l34,0 l0,20 l-12,10 l0,26 l-20,0 l0,-26 l-14,-10 z" fill="#46e39a22" stroke="#46e39a" stroke-width="2.5"/>'+
      '<text x="377" y="86" text-anchor="middle" font-size="11.5" fill="#46e39a" font-weight="700">'+e.name+'</text></g>';
    $('#lkProd').innerHTML='';
    $('#lkTxt').innerHTML='<b style="color:#fff">'+e.name+'</b> · Ort: '+e.place+'. Drücke «Reaktion starten».';
  }
  $$('[data-enz]').forEach(b=> b.addEventListener('click',()=>{ cur=b.dataset.enz; drawLock(); }));
  $('#lkRun').addEventListener('click',()=>{
    if(lkBusy) return; lkBusy=true;
    const e = ENZ[cur];
    const g = $('#lkEnzG');
    g.style.transition='transform .8s cubic-bezier(.4,0,.2,1)';
    g.style.transform='translate(-190px,0)';
    setTimeout(()=>{
      $('#lkSub').style.transition='opacity .4s'; $('#lkSub').style.opacity='0';
      const parts = e.prod.parts;
      const w=42, gap=6;
      let x = 90, out='';
      parts.forEach(cnt=>{
        for(let i=0;i<cnt;i++){
          out+='<rect x="'+x+'" y="66" width="'+w+'" height="40" rx="9" fill="'+e.prod.col+'22" stroke="'+e.prod.col+'" stroke-width="2"/>';
          x+=w+gap;
        }
        x+=8;
      });
      out+='<text x="220" y="52" class="lbl-b" text-anchor="middle" font-size="12" fill="'+e.prod.col+'">'+e.prod.label+'</text>';

function m6init(){

    if(!was) s.classList.add('open');
  }));
  $('#jAll').addEventListener('click',()=> steps.forEach(s=>s.classList.add('open')));
  let timer=null;
  $('#jStop').addEventListener('click',()=>clearInterval(timer));
  $('#jPlay').addEventListener('click',()=>{
    clearInterval(timer); let i=0;
    steps.forEach(s=>s.classList.remove('open'));

      if(i>=steps.length){ clearInterval(timer); toast('🏁 Verdauung abgeschlossen!'); return; }
      steps.forEach(s=>s.classList.remove('open'));
      steps[i].classList.add('open');
      steps[i].scrollIntoView({behavior:'smooth',block:'center'});
      i++;
    },2600);
  });
}

      out += '<g><circle cx="'+x+'" cy="'+y+'" r="7" fill="#f7b955" opacity=".85"/><circle cx="'+(x+11)+'" cy="'+y+'" r="7" fill="#f7b955" opacity=".65"/><circle cx="'+(x+22)+'" cy="'+y+'" r="7" fill="#f7b955" opacity=".45"/></g>';
    }
    $('#gly').innerHTML = out;
    $('#flowIn').setAttribute('opacity', v>55 ? '1':'0');
    $('#flowOut').setAttribute('opacity', v<45 ? '1':'0');
    if(v>62){
      $('#glyLbl').textContent='Speicher füllt sich: Traubenzucker → lange Ketten (Glykogen)';
      $('#glyTxt').innerHTML='<span class="hl-a">Nach dem Essen:</span> Es kommt viel Traubenzucker aus dem Darm an. Die Leber <b>speichert ihn in langen Ketten als Glykogen</b>. Der Speicher füllt sich auf.';
    } else if(v<38){
      $('#glyLbl').textContent='Speicher leert sich: Glykogen → Traubenzucker';
      $('#glyTxt').innerHTML='<span class="hl">Beim Fasten oder Sport:</span> Der Körper braucht Energie. Die Leber <b>wandelt Glykogen wieder in Traubenzucker um</b> und gibt ihn ans Blut ab.';
    } else {
      $('#glyLbl').textContent='Ausgeglichener Speicher';
      $('#glyTxt').innerHTML='Gleichgewicht: Die Leber speichert und gibt je nach Bedarf ab. Sie ist <b>für die Energieversorgung des Körpers verantwortlich</b>.';
    }
  }
  r.addEventListener('input', e=>drawGly(+e.target.value));
  drawGly(50);
}

function m9init(){
  shellInit(MODULES[8]);
  let rafs=[], timers=[];
  function clearAll(){
    timers.forEach(t=>clearTimeout(t)); timers=[];
    rafs.forEach(r=>cancelAnimationFrame(r)); rafs=[];
  }
  function count(el,to,dur){
    const t0=performance.now();
    function f(now){
      const t=Math.min((now-t0)/dur,1);
      el.textContent = (to*t).toFixed(to%1?1:0);
      if(t<1) rafs.push(requestAnimationFrame(f));
    }
    rafs.push(requestAnimationFrame(f));
  }
  function resetSim(){
    clearAll();
    $('#drops').innerHTML='';
    $('#resorb').setAttribute('opacity','0');
    ['cPrim','cRes','cUrin'].forEach(id=>$('#'+id).textContent='0');
  }
  $('#nReset').addEventListener('click', resetSim);

    resetSim();

      html += '<circle r="'+s.r+'" fill="'+s.c+'" cx="195" cy="130"><animateMotion dur="3.4s" begin="'+(i*0.22)+'s" fill="freeze" path="'+TUB+'"/></circle>';
    });
    $('#drops').innerHTML = html;
    count($('#cPrim'),180,1600);
    timers.push(setTimeout(()=>{
      $('#resorb').setAttribute('opacity','1');
      $('#drops').innerHTML =
        '<circle r="5" fill="#ff7d7d" cx="510" cy="240"><animateMotion dur="1.6s" fill="freeze" path="M510,240 C 560,240 600,240 640,240"/></circle>'+

      count($('#cRes'),178.5,2000);
    },2400));
    timers.push(setTimeout(()=>{ count($('#cUrin'),1.5,1400); toast('💧 180 L Primärharn → 1,5 L Urin'); },4600));
  });
}

function cardsInit(){
  if(!state.cardOrder.length) state.cardOrder = CARDS.map((_,i)=>i);
  const fc = $('#fc');
  function show(){
    const i = state.cardOrder[state.cardIdx];
    $('#fcQ').textContent = CARDS[i][0];
    $('#fcA').textContent = CARDS[i][1];
    fc.classList.remove('flipped'); state.cardFlipped=false;
    $('#ccount').textContent = 'Karte '+(state.cardIdx+1)+' / '+CARDS.length;
    $('#cbar').style.width = ((state.cardIdx+1)/CARDS.length*100)+'%';
  }
  show();
  function flip(){ fc.classList.toggle('flipped'); state.cardFlipped=!state.cardFlipped; }
  function next(){ state.cardIdx=(state.cardIdx+1)%CARDS.length; show(); }
  function prev(){ state.cardIdx=(state.cardIdx-1+CARDS.length)%CARDS.length; show(); }
  function markKnown(){
    const i = state.cardOrder[state.cardIdx];
    state.knownCards.add(i); save();
    $('#knownTxt').textContent = state.knownCards.size;
    $('#kbar').style.width = (state.knownCards.size/CARDS.length*100)+'%';
    toast('✓ Gemerkt – '+state.knownCards.size+'/'+CARDS.length+' Karten gemeistert');
    next();
  }
  fc.addEventListener('click', flip);
  $('#fcFlip').addEventListener('click', e=>{e.stopPropagation(); flip();});
  $('#fcNext').addEventListener('click', next);
  $('#fcPrev').addEventListener('click', prev);
  $('#fcKnown').addEventListener('click', markKnown);
  $('#fcShuffle').addEventListener('click',()=>{
    state.cardOrder.sort(()=>Math.random()-.5); state.cardIdx=0; show(); toast('🔀 Karten gemischt');
  });
  $('#fcAgain').addEventListener('click',()=>{
    const unknown = CARDS.map((_,i)=>i).filter(i=>!state.knownCards.has(i));
    if(!unknown.length){ toast('🎉 Alle Karten gemeistert!'); return; }
    state.cardOrder = unknown.sort(()=>Math.random()-.5); state.cardIdx=0; show();
    toast('↺ '+unknown.length+' Karten zum Üben');
  });
  $('#fcReset').addEventListener('click',()=>{
    state.knownCards.clear(); save(); state.cardOrder = CARDS.map((_,i)=>i); state.cardIdx=0; show();
    $('#knownTxt').textContent='0'; $('#kbar').style.width='0%'; toast('⟲ Alles zurückgesetzt');
  });
  document.onkeydown = (e)=>{
    if(state.view!=='cards') return;
    if(e.code==='Space'){ e.preventDefault(); flip(); }
    if(e.key==='ArrowRight') next();
    if(e.key==='ArrowLeft') prev();
    if(e.key==='1') markKnown();
    if(e.key==='2') next();
  };
}

function renderQuiz(){
  return '<div class="view">'+
  '<div class="eyebrow">Simulation</div><h1>🎯 Prüfungssimulator</h1>'+
  '<p class="lead">'+QUIZ.length+' Fragen im Stil deines Tests – zufällig gemischt, mit sofortiger Rückmeldung und Erklärung. Ziel: <strong>80 % oder mehr</strong>.</p>'+
  '<div id="quizBox" style="margin-top:24px"></div></div>';
}
function quizInit(){
  state.quizOrder = QUIZ.map((_,i)=>i).sort(()=>Math.random()-.5);
  state.quizIdx=0; state.quizScore=0; state.quizWrong=[]; state.quizStart=Date.now();
  drawQ();
}
function drawQ(){
  const box = $('#quizBox');
  if(state.quizIdx >= state.quizOrder.length){ return quizResult(box); }
  const q = QUIZ[state.quizOrder[state.quizIdx]];
  state.quizAnswered=false;
  box.innerHTML =
    '<div class="qprog"><i style="width:'+(state.quizIdx/state.quizOrder.length*100)+'%"></i></div>'+
    '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">'+
        '<span class="pill sky">Frage '+(state.quizIdx+1)+' / '+state.quizOrder.length+'</span>'+
        '<span class="pill mint">✓ '+state.quizScore+' richtig</span>'+
      '</div>'+
      '<h2 style="font-size:20px;line-height:1.4">'+q.q+'</h2>'+
      '<div class="qopts" id="qopts">'+
        q.o.map((o,i)=>'<button class="qopt" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+o+'</span></button>').join('')+
      '</div>'+
      '<div class="qfb" id="qfb"></div>'+
      '<div style="margin-top:18px;text-align:right"><button class="btn btn-primary" id="qNext" style="display:none">Weiter →</button></div>'+
    '</div>';
  $$('#qopts .qopt').forEach(b=> b.addEventListener('click',()=> answer(+b.dataset.i, q)));
  $('#qNext').addEventListener('click',()=>{ state.quizIdx++; drawQ(); });
}
function answer(i,q){
  if(state.quizAnswered) return;
  state.quizAnswered=true;
  const btns = $$('#qopts .qopt');
  btns.forEach(b=>b.disabled=true);
  const ok = i===q.a;
  btns[q.a].classList.add('correct');
  if(!ok){ btns[i].classList.add('wrong'); state.quizWrong.push({q:q.q, given:q.o[i], right:q.o[q.a], ex:q.e}); }
  else state.quizScore++;
  const fb = $('#qfb');
  fb.className = 'qfb show '+(ok?'ok':'no');
  fb.innerHTML = (ok?'<b>✓ Richtig!</b> ':'<b>✗ Leider falsch.</b> Richtig wäre: <b>'+q.o[q.a]+'</b>. ')+'<br><span style="color:#94a2c2">'+q.e+'</span>';
  $('#qNext').style.display='inline-flex';
}
function quizResult(box){
  const total = state.quizOrder.length;
  const pct = Math.round(state.quizScore/total*100);
  const secs = Math.round((Date.now()-state.quizStart)/1000);
  let grade, gcol, gmsg;
  if(pct>=90){grade='Sehr stark';gcol='#46e39a';gmsg='Du bist bereit für den Test. Geh früh schlafen!';}
  else if(pct>=75){grade='Gut';gcol='#5fb2ff';gmsg='Solide. Schau dir die falschen Fragen unten noch einmal an.';}
  else if(pct>=60){grade='Genügend';gcol='#f7b955';gmsg='Knapp – wiederhole die Module zu deinen Fehlern.';}
  else {grade='Noch üben';gcol='#ff7d7d';gmsg='Lies den Crash-Zettel und wiederhole die Module gezielt.';}
  box.innerHTML =
  '<div class="card glow" style="text-align:center;padding:38px 22px">'+
    '<div style="font-size:56px;margin-bottom:8px">'+(pct>=75?'🏆':pct>=60?'👍':'📚')+'</div>'+
    '<h2 style="font-size:32px;color:'+gcol+'">'+state.quizScore+' / '+total+' richtig · '+pct+' %</h2>'+
    '<p style="font-size:15px;margin-top:8px"><b style="color:'+gcol+'">'+grade+'</b> — '+gmsg+'</p>'+
    '<div class="grid3" style="margin-top:22px">'+
      '<div class="stat"><div class="v" style="color:#46e39a">'+state.quizScore+'</div><div class="l">richtig</div></div>'+
      '<div class="stat"><div class="v" style="color:#ff7d7d">'+(total-state.quizScore)+'</div><div class="l">falsch</div></div>'+
      '<div class="stat"><div class="v" style="color:#5fb2ff">'+Math.floor(secs/60)+'m '+(secs%60)+'s</div><div class="l">Zeit</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap">'+
      '<button class="btn btn-primary" id="qRestart">🔄 Nochmal (neu gemischt)</button>'+
      '<button class="btn" id="qCards">🃏 Karteikarten üben</button>'+
      '<button class="btn btn-ghost" id="qCrash">⚡ Crash-Zettel</button>'+
    '</div>'+
  '</div>'+
  (state.quizWrong.length ?
    '<div class="card"><h2>🔁 Das musst du nachholen</h2><p>'+state.quizWrong.length+' Fragen waren falsch. Lies die Erklärungen – genau daraus bestehen Tests.</p>'+
    state.quizWrong.map(w=>'<div class="lab" style="margin-bottom:12px"><div class="lab-head"><span class="pill coral">FALSCH</span><span class="lab-title">'+w.q+'</span></div>'+
      '<p style="font-size:13.4px"><span style="color:#ff9d9d">Deine Antwort:</span> '+w.given+'</p>'+
      '<p style="font-size:13.4px"><span style="color:#46e39a">Richtig:</span> <b style="color:#fff">'+w.right+'</b></p>'+
      '<p style="font-size:13px;margin-top:7px;color:#94a2c2">'+w.ex+'</p></div>').join('')+
    '</div>' : '<div class="card" style="text-align:center"><h2 style="color:#46e39a">🎉 Fehlerfrei!</h2><p>Keine einzige Frage falsch. Viel Erfolg morgen!</p></div>');
  $('#qRestart').addEventListener('click', quizInit);
  $('#qCards').addEventListener('click',()=>go('cards'));
  $('#qCrash').addEventListener('click',()=>go('crash'));
  window.scrollTo({top:0,behavior:'smooth'});
}

 ['Gallenflüssigkeit','In der Leber gebildet, in der Gallenblase gesammelt. Zerteilt grosse Fetttropfen in kleine Tröpfchen.'],
 ['Resorption','Aufnahme: im Dünndarm die Nährstoffe ins Blut, im Nierenkanälchen die Rückholung aus dem Primärharn.'],
 ['Darmzotten','Winzige Ausstülpungen auf den Darmfalten; vergrössern die Oberfläche auf ca. 200 m².'],
 ['Oberflächenvergrösserung','Durch Falten und Zotten; ermöglicht schnelle Aufnahme grosser Nährstoffmengen.'],
 ['Ballaststoffe','Unverdauliche Nahrungsbestandteile (z. B. Cellulose), die im Dickdarm landen.'],
 ['Darmbakterien','Milliarden Bakterien im Dünn- und Dickdarm; produzieren lebenswichtige Stoffe für die Abwehr von Krankheitserregern.'],
 ['Laktose-Intoleranz','Milchzucker wird im Dünndarm nicht abgebaut, gelangt in den Dickdarm und wird dort von Bakterien zersetzt → Krämpfe, Übelkeit, Durchfall.'],
 ['Nierenkörperchen','Filtereinheit der Niere: Kapillarknäuel umgeben von einer Kapsel. Über eine Million pro Niere.'],
 ['Filtration','In den Nierenkörperchen wird ein Teil des Blutplasmas durch die Löcher der Kapillarwände gedrückt.'],
 ['Primärharn','Wasser mit gelösten Abfallstoffen, Traubenzucker, Vitaminen und Mineralstoffen. 180 Liter pro Tag.'],
 ['Nierenkanälchen','Hier wird dem Primärharn Wasser, ein Grossteil der Mineralstoffe und des Traubenzuckers wieder entzogen.'],
 ['Endharn / Urin','Konzentrierter Rest nach der Resorption: ca. 1,5 Liter/Tag, rund 95 % Wasser.'],
 ['Osmose','Passiver Ausgleich eines Konzentrationsunterschieds: Wasser strömt dorthin, wo mehr gelöste Stoffe sind. Braucht keine Energie.'],
 ['Harnleiter','Leitet den Urin von den Nieren in die Harnblase.'],
 ['Verweildauer','Zeit, die der Nahrungsbrei im Magen liegt – bis zu 8 Stunden; fettreiche Nahrung verzögert sie.']
];
function renderGlossar(){
  return '<div class="view">'+
  '<div class="eyebrow">Nachschlagewerk</div><h1>📖 Fachbegriffe</h1>'+
  '<p class="lead">'+GLOSS.length+' Begriffe aus dem Dossier. Im Test musst du sie erklären können – suche und lies sie laut vor.</p>'+
  '<input class="searchbar" id="gs" placeholder="🔍 Begriff suchen … (z. B. Osmose, Resorption, Zotten)" style="margin-top:20px">'+
  '<div class="gloss" id="gl"></div></div>';
}
function glossarInit(){
  function draw(f){
    const list = GLOSS.filter(g=> !f || (g[0]+' '+g[1]).toLowerCase().includes(f));
    $('#gl').innerHTML = list.length
      ? list.map(g=>'<div class="gterm"><b>'+g[0]+'</b><span>'+g[1]+'</span></div>').join('')
      : '<p style="color:#6c7a99">Kein Treffer für «'+f+'».</p>';
  }
  draw('');
  $('#gs').addEventListener('input', e=> draw(e.target.value.toLowerCase().trim()));
}
